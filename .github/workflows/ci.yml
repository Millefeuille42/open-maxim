name: CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install dependencies
        run: go mod download

      - name: Lint
        run: make lint

      - name: Format
        run: make format

      - name: Build Binary
        run: go build -v ./cmd/server/
